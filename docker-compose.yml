services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: starter_app
    platform: linux/amd64
    restart: unless-stopped
    working_dir: /var/www/html
    environment:
      - PHP_FPM_LISTEN=9000
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./app:/var/www/html
      - ./server/nginx.conf:/etc/nginx/conf.d/default.conf
      - ./server/ssl:/etc/nginx/ssl
    depends_on:
      - mysql
    networks:
      - starter_network

  mysql:
    image: mysql:8.0
    container_name: starter_mysql
    platform: linux/amd64
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: starter
      MYSQL_USER: starter
      MYSQL_PASSWORD: 123
      MYSQL_ROOT_PASSWORD: 123
    volumes:
      - ./data/mysql:/var/lib/mysql
    ports:
      - "3306:3306"
    networks:
      - starter_network

  # Opcional: phpMyAdmin para gerenciamento do banco de dados
  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: starter_phpmyadmin
    platform: linux/amd64
    depends_on:
      - mysql
    environment:
      PMA_HOST: mysql
      PMA_USER: root
      PMA_PASSWORD: 123
    ports:
      - "8081:80"
    networks:
      - starter_network

networks:
  starter_network:
    driver: bridge